# Managed by hugo-styles.
# x-release-please-version: v0.7.0
name: Update hugo-styles

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    uses: ./.github/workflows/reusable-refresh-vendored-modules.yml
    secrets: inherit
    with:
      site-root: .
      go-version-file: go.mod
      refresh-command: |
        hugo mod get -u github.com/oer-particle-physics/hugo-styles@latest
        hugo mod tidy
        ./scripts/sync-template-files.sh
        hugo mod vendor
      verify-command: |
        python3 scripts/build-versioned-site.py --use-current-checkout
        hugo --gc --minify --noBuildLock --destination /tmp/site
